# Проверка pull request в master. На сервер не заходит.
# Состояние машины подделывается во временном каталоге: образцы env вместо
# секретов и самоподписанные сертификаты вместо боевых.

name: PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Stacks
    runs-on: ubuntu-latest
    env:
      SCRIBO_ROOT: ${{ github.workspace }}/.root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fake machine state
        run: |
          set -eu
          mkdir -p "$SCRIBO_ROOT"/edge "$SCRIBO_ROOT"/prod/env "$SCRIBO_ROOT"/stage/env
          cp env/edge.env.example "$SCRIBO_ROOT/edge/stack.env"
          for stack in prod stage; do
            cp env/stack.env.example "$SCRIBO_ROOT/$stack/stack.env"
            for service in backend frontend socket; do
              cp "env/$service.env.example" "$SCRIBO_ROOT/$stack/env/$service.env"
            done
          done
          # Стейдж отличается от прода только этим файлом, так же как на машине.
          sed -i \
            -e 's/^STACK=prod/STACK=stage/' \
            -e 's/^COMPOSE_PROJECT_NAME=scribo-prod/COMPOSE_PROJECT_NAME=scribo-stage/' \
            -e 's/^IMAGE_TAG=latest/IMAGE_TAG=staging/' \
            "$SCRIBO_ROOT/stage/stack.env"
          sed -i 's/^BACKUP_ENABLED=true/BACKUP_ENABLED=false/' \
            "$SCRIBO_ROOT/stage/env/backend.env"
          # Домены берём из того же образца, что и nginx, чтобы списки не разъезжались.
          for entry in $(sed -n 's/^STACKS=//p' "$SCRIBO_ROOT/edge/stack.env"); do
            domain=${entry#*:}
            dir="$SCRIBO_ROOT/edge/certs/live/$domain"
            mkdir -p "$dir"
            openssl req -x509 -nodes -newkey rsa:2048 \
              -keyout "$dir/privkey.pem" -out "$dir/fullchain.pem" \
              -days 1 -subj "/CN=$domain"
          done

      - name: Compose config
        run: |
          set -eu
          for target in prod stage edge; do
            ./scribo config "$target" >/dev/null
          done
          # Приписки окружений должны попасть в имена контейнеров: по ним nginx
          # различает стеки, и пустое значение слепило бы их в один.
          ./scribo config prod | grep -q 'container_name: prod-backend'
          ./scribo config stage | grep -q 'container_name: stage-backend'
          # Загрузки и бекапы у окружений свои: путь считается от каталога окружения.
          # Загрузки и бекапы у окружений свои: путь считается от каталога окружения.
          ./scribo config prod | grep -q "source: $SCRIBO_ROOT/prod/uploads"
          ./scribo config stage | grep -q "source: $SCRIBO_ROOT/stage/backups"
          ./scribo config edge | grep -q "source: $SCRIBO_ROOT/stage/uploads"

      - name: Nginx render and test
        run: ./scribo check
