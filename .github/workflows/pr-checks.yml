# Проверка pull request в master. На сервер не заходит.
# nginx -t идёт с временным сертификатом: боевой лежит только на машине.

name: PR checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: nginx -t
        run: |
          mkdir -p certs/live/scribo-blog.duckdns.org
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout certs/live/scribo-blog.duckdns.org/privkey.pem \
            -out certs/live/scribo-blog.duckdns.org/fullchain.pem \
            -days 1 \
            -subj /CN=scribo-blog.duckdns.org
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/errors:/usr/share/nginx/errors:ro" \
            -v "$PWD/certs:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t

      - name: Compose config
        run: |
          cp env/backend.env.example env/backend.env
          cp env/frontend.env.example env/frontend.env
          cp env/socket.env.example env/socket.env
          docker compose config --quiet
