
name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Edge files in this push
        id: edge
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "recreate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -Eq '^edge/'; then
            echo "recreate=true" >> "$GITHUB_OUTPUT"
          else
            echo "recreate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EDGE_RECREATE: ${{ steps.edge.outputs.recreate }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: EDGE_RECREATE
          script_stop: true
          script: |
            set -eu
            cd /srv/scribo/infra
            git pull --ff-only
            ./scribo up prod
            ./scribo up stage
            if [ "$EDGE_RECREATE" = "true" ]; then
              ./scribo check
              ./scribo up edge --force-recreate
            fi
