name: scribo

services:
  nginx:
    image: nginx:1.27-alpine
    mem_limit: 32m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./errors:/usr/share/nginx/errors:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      socket:
        condition: service_healthy
    networks:
      - scribo
    restart: unless-stopped

  frontend:
    image: ghcr.io/scribo-blog-org/frontend:latest
    mem_limit: 280m
    env_file:
      - ./env/frontend.env
    expose:
      - "3000"
    networks:
      - scribo
    restart: unless-stopped

  backend:
    image: ghcr.io/scribo-blog-org/backend:latest
    mem_limit: 280m
    env_file:
      - ./env/backend.env
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - scribo
    restart: unless-stopped

  socket:
    image: ghcr.io/scribo-blog-org/socket:latest
    mem_limit: 128m
    env_file:
      - ./env/socket.env
    environment:
      PORT: "3002"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3002"
    networks:
      - scribo
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    mem_limit: 160m
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - scribo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
    restart: unless-stopped

networks:
  scribo:
    name: scribo
