
name: scribo

services:
  mongo:
    image: mongo:7
    container_name: scribo-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: scribo
      MONGO_INITDB_ROOT_PASSWORD: scribo
      MONGO_INITDB_DATABASE: scribo
    volumes:
      - scribo-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scribo-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../../backend
    container_name: scribo-backend
    env_file: ../../backend/.env
    environment:
      PORT: "3001"
      MONGODB_URI: mongodb://scribo:scribo@mongo:27017/scribo?authSource=admin
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
      BACKUP_ENABLED: "true"
      SERVE_UPLOADS: "true"
    volumes:
      - scribo-uploads:/app/uploads
      - scribo-backups:/app/backups
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  socket:
    build: ../../socket
    container_name: scribo-socket
    env_file: ../../socket/.env
    environment:
      PORT: "3002"
      MONGODB_URI: mongodb://scribo:scribo@mongo:27017/scribo?authSource=admin
      REDIS_URL: redis://redis:6379
      DB_NAME: scribo
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../../frontend
    container_name: scribo-frontend
    env_file: ../../frontend/.env.local
    network_mode: "service:backend"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  scribo-mongo-data:
  scribo-uploads:
  scribo-backups:
