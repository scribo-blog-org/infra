name: scribo-stage

services:
  stage-frontend:
    image: ghcr.io/scribo-blog-org/frontend:staging
    container_name: scribo-stage-frontend
    mem_limit: 120m
    env_file:
      - ./env/stage/frontend.env
    expose:
      - "3000"
    networks:
      - scribo
    restart: unless-stopped

  stage-backend:
    image: ghcr.io/scribo-blog-org/backend:staging
    container_name: scribo-stage-backend
    mem_limit: 120m
    env_file:
      - ./env/stage/backend.env
    environment:
      PORT: "3001"
      REDIS_URL: redis://stage-redis:6379
    depends_on:
      stage-redis:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - scribo
    restart: unless-stopped

  stage-socket:
    image: ghcr.io/scribo-blog-org/socket:staging
    container_name: scribo-stage-socket
    mem_limit: 64m
    env_file:
      - ./env/stage/socket.env
    environment:
      PORT: "3002"
      REDIS_URL: redis://stage-redis:6379
    depends_on:
      stage-redis:
        condition: service_healthy
    expose:
      - "3002"
    networks:
      - scribo
    restart: unless-stopped

  stage-redis:
    image: redis:7-alpine
    container_name: scribo-stage-redis
    mem_limit: 160m
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - scribo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
    restart: unless-stopped

networks:
  scribo:
    external: true
    name: scribo
