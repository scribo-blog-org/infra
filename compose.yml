
services:
  frontend:
    image: ghcr.io/scribo-blog-org/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${STACK:?STACK is required}-frontend
    mem_limit: ${MEM_FRONTEND:-512m}
    env_file:
      - ./env/frontend.env
    depends_on:
      backend:
        condition: service_healthy
      socket:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: ghcr.io/scribo-blog-org/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${STACK:?STACK is required}-backend
    mem_limit: ${MEM_BACKEND:-512m}
    env_file:
      - ./env/backend.env
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      redis:
        condition: service_healthy
      socket:
        condition: service_healthy
      mongo:
        condition: service_healthy
        required: false
    expose:
      - "3001"
    restart: unless-stopped

  socket:
    image: ghcr.io/scribo-blog-org/socket:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${STACK:?STACK is required}-socket
    mem_limit: ${MEM_SOCKET:-256m}
    env_file:
      - ./env/socket.env
    environment:
      PORT: "3002"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
        required: false
    expose:
      - "3002"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${STACK:?STACK is required}-redis
    mem_limit: ${MEM_REDIS:-320m}
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  mongo:
    profiles: ["mongo"]
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: ${STACK:?STACK is required}-mongo
    mem_limit: ${MEM_MONGO:-1g}
    env_file:
      - ./env/mongo.env
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - ${MONGO_CACHE_GB:-0.5}
    volumes:
      - ./mongo:/data/db
      - ${SCRIBO_INFRA_DIR:-/srv/scribo/infra}/mongo/init-app-user.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: scribo-${STACK:?STACK is required}
