
name: scribo-edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    mem_limit: ${MEM_NGINX:-64m}
    ports:
      - "80:80"
      - "443:443"
    environment:
      STACKS: ${STACKS:?STACKS is required}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./stack.conf.template:/etc/nginx/stack.conf.template:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./errors:/usr/share/nginx/errors:ro
      - ./entrypoint.d/10-render-stacks.sh:/docker-entrypoint.d/10-render-stacks.sh:ro
      - ${STATE_DIR:?STATE_DIR is required}/certs:/etc/letsencrypt:ro
      - ${STATE_DIR:?STATE_DIR is required}/certbot-www:/var/www/certbot:ro
      - ${SCRIBO_ROOT:?SCRIBO_ROOT is required, run through ./scribo}/prod/uploads:/srv/uploads/prod:ro
      - ${SCRIBO_ROOT:?SCRIBO_ROOT is required, run through ./scribo}/stage/uploads:/srv/uploads/stage:ro
    networks:
      - prod
      - stage
    restart: unless-stopped

  status:
    image: python:3.12-alpine
    container_name: edge-status
    mem_limit: ${MEM_STATUS:-128m}
    env_file:
      - ${STATUS_ENV:?STATUS_ENV is required, run through ./scribo}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    command: ["python", "-u", "/opt/statusd.py"]
    volumes:
      - ./status/statusd.py:/opt/statusd.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - prod
      - stage
    restart: unless-stopped

networks:
  prod:
    external: true
    name: scribo-prod
  stage:
    external: true
    name: scribo-stage
