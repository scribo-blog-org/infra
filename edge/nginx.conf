worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker DNS. A variable in proxy_pass forces a fresh lookup,
    # so recreating one app container does not leave nginx on the old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Блоки server на каждое окружение. Их пишет 10-render-stacks.sh при старте
    # контейнера из stack.conf.template по списку STACKS.
    include /etc/nginx/conf.d/*.conf;
}
