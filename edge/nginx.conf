worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map "$http_user_agent|$request_uri" $log_google {
        default 0;
        ~*google 1;
        ~*\|/(sitemap\.xml|robots\.txt)(\?.*)?$ 1;
    }
    log_format google '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                      '${request_time}s host=$host ua="$http_user_agent"';
    access_log /dev/stdout google if=$log_google;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    include /etc/nginx/conf.d/*.conf;
}
