worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Access log only for Google crawlers and for the two files they fetch
    # first, robots.txt and the sitemap. It shows which status and how many
    # bytes Googlebot really gets, without logging every visitor.
    map "$http_user_agent|$request_uri" $log_google {
        default 0;
        ~*google 1;
        ~*\|/(sitemap\.xml|robots\.txt)(\?.*)?$ 1;
    }
    log_format google '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                      '${request_time}s host=$host ua="$http_user_agent"';
    access_log /dev/stdout google if=$log_google;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker DNS. A variable in proxy_pass forces a fresh lookup,
    # so recreating one app container does not leave nginx on the old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Блоки server на каждое окружение. Их пишет 10-render-stacks.sh при старте
    # контейнера из stack.conf.template по списку STACKS.
    include /etc/nginx/conf.d/*.conf;
}
